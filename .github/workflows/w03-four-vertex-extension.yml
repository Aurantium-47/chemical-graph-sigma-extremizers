              imports=run([lean,'--deps',str(source)],name+'-imports',cwd=project,seconds=60)
              deps=[pathlib.Path(s.strip()).resolve() for s in imports.splitlines() if s.strip()]
              expected_own_imports={own[0]:[],own[1]:[own[0]],own[2]:[own[0]],own[3]:[own[2],own[1]],own[4]:[own[3]],own[5]:[own[4]],own[6]:[own[5]],own[7]:[own[6]],own[8]:[own[2]],own[9]:[own[8]],own[10]:[own[8]],own[11]:[own[10],own[9]],own[12]:[],own[13]:[own[11],own[12]],own[14]:[own[13]]}
              for dependency in expected_own_imports[name]:
