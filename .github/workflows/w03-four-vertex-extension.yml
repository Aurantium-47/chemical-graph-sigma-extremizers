name: Exact parity penalty bounds and equality cases

'on':
  push:
    branches: [codex/w03-four-vertex-extension]
    paths: [lean-candidate/**, .github/workflows/w03-four-vertex-extension.yml]

permissions: {}
concurrency:
  group: w03-four-vertex-extension
  cancel-in-progress: false

jobs:
  extension-bridge:
    if: github.event.repository.private == false && github.repository == 'Aurantium-47/chemical-graph-sigma-extremizers'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CANDIDATE_SHA: ${{ github.sha }}
      LEAN_NUM_THREADS: '1'
      MATHLIB_NO_CACHE_ON_UPDATE: '1'
    steps:
      - name: Check the fixed candidate, compile fifteen modules, and inspect declarations
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re, shutil, signal, subprocess, time
          workspace = pathlib.Path.cwd()
          output = workspace / 'execution-records'
          assert not output.exists()
          output.mkdir()
          build_start = time.monotonic()
          env = dict(os.environ, LEAN_NUM_THREADS='1', MATHLIB_NO_CACHE_ON_UPDATE='1')

          def available():
              return int(re.search(r'^MemAvailable:\s+(\d+)', pathlib.Path('/proc/meminfo').read_text(), re.M)[1]) * 1024

          def sha(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()

          def group_memory(group):
              rss, swap = 0, 0
              for directory in pathlib.Path('/proc').iterdir():
                  if not directory.name.isdigit(): continue
                  try:
                      stat = (directory / 'stat').read_text().rsplit(')', 1)[1].split()
                      if int(stat[2]) != group: continue
                      status = (directory / 'status').read_text()
                      for field, amount in re.findall(r'^(VmRSS|VmSwap):\s+(\d+)', status, re.M):
                          if field == 'VmRSS': rss += int(amount) * 1024
                          else: swap += int(amount) * 1024
                  except (FileNotFoundError, ProcessLookupError): continue
              return rss, swap

          def stop(group):
              try: os.killpg(group, signal.SIGKILL)
              except ProcessLookupError: pass

          def run(args, label, cwd=workspace, seconds=180):
              assert available() >= 8 * 1024**3, 'Command preflight failed; no retry'
              assert time.monotonic() - build_start < 1200, 'Total budget exhausted'
              log = output / (label + '.log')
              started = time.monotonic()
              record = dict(command=args, peak_group_rss=0, peak_group_swap=0, abort_reason=None)
              print('COMMAND', label, args, flush=True)
              with log.open('xb') as stream:
                  process = subprocess.Popen(args, cwd=cwd, env=env, stdout=stream,
                      stderr=subprocess.STDOUT, start_new_session=True)
                  try:
                      while process.poll() is None:
                          rss, swap = group_memory(process.pid)
                          record['peak_group_rss'] = max(record['peak_group_rss'], rss)
                          record['peak_group_swap'] = max(record['peak_group_swap'], swap)
                          if rss > 6 * 1024**3: record['abort_reason'] = 'group_rss'
                          elif swap > 512 * 1024**2: record['abort_reason'] = 'group_swap'
                          elif available() < 2 * 1024**3: record['abort_reason'] = 'system_available'
                          elif time.monotonic() - started > seconds: record['abort_reason'] = 'command_time'
                          elif time.monotonic() - build_start > 1200: record['abort_reason'] = 'total_time'
                          if record['abort_reason']:
                              stop(process.pid)
                              break
                          time.sleep(0.5)
                  finally:
                      if process.poll() is None: stop(process.pid)
                      record['exit_code'] = process.wait()
                      record['elapsed_seconds'] = time.monotonic() - started
              text = log.read_text(errors='replace')
              print(text, flush=True)
              print('RESOURCE_RESULT', label, json.dumps(record, sort_keys=True), flush=True)
              print('LOG_SHA256', label, sha(log), flush=True)
              (output / (label + '.json')).write_text(json.dumps(record, indent=2))
              assert record['exit_code'] == 0 and record['abort_reason'] is None, 'Stop without retry or escalation'
              assert not re.search(r"declaration uses ['`]sorry|\bsorryAx\b", text), 'Unfinished declaration'
              return text

          mem = {s.split(':')[0]: int(s.split()[1])*1024 for s in pathlib.Path('/proc/meminfo').read_text().splitlines() if s.startswith(('MemTotal:', 'MemAvailable:'))}
          print('RUNNER_RESOURCES', json.dumps(dict(mem, disk_free=shutil.disk_usage('.').free)), flush=True)
          assert mem['MemTotal'] >= 14*1024**3 and mem['MemAvailable'] >= 12*1024**3
          assert shutil.disk_usage('.').free >= 10*1024**3
          print('BUDGET: single thread; 6 GiB group RSS; 512 MiB group swap; 2 GiB available floor; 8 GiB before every command; 180 s/module; 1200 s including setup; no retry.', flush=True)
          root = workspace / 'public-source'
          baseline = '081c9289a709d55457c172f3b355d77c5b6a4688'
          expected = {'lean-candidate/lake-manifest.json': '7d63750392d2e1501fdc587db7dfe7c4a6a59ce68d83b492feb340863f309269', 'lean-candidate/lakefile.toml': '0e605495d5cbd33390d3f84dc0a9761f46503b7153f2407d7d28e26ee8ade1e3', 'lean-candidate/lean-toolchain': '55e97be96000b5e9e290c9e74482e5e317861499a5540353ce845471bded8cea', 'lean-candidate/W03/BaseCertificates.lean': 'f93d1afd130cacf011992907ba458f773899c8379f2df5039fc23aac1b169f26', 'lean-candidate/W03/BaseGraphs.lean': 'c1c079f0b3c43f0dd5264cf0f3c217c9a6296e7bb1192f14b18bf26d67d25d76', 'lean-candidate/W03/ExtensionCounts.lean': '3e149b241fd05625d31f8510320248769f291fd566c4d519aee5bd18c206d470', 'lean-candidate/W03/FiniteExtension.lean': '74c60291f32189e9a2d7599e67d1c49a623acf9fde42a6115ad42f154b133413', 'lean-candidate/W03/FourVertexExtension.lean': '6c21281db6d0163705fe6e6a634a17f52cc4694a5cd136dfeb7766cfb8eede90', 'lean-candidate/W03/FourVertexExtensionConnected.lean': '4dd9e309ab1af8c3fb5ba36e14d9c4ef96f7f0764d0e16663f8d7fe9c7cb1d52', 'lean-candidate/W03/IndexDecomposition.lean': 'd35f70167dc11bd631abf57ea12ae4a557166fb0a7cd6ccee696f148e4f3443d', 'lean-candidate/W03/PairCounting.lean': 'aef5b90f561e50388c67cfb1aca50025518a331cb4c2b92493d014e70de05ba0', 'lean-candidate/W03/ParityPenalty.lean': 'caa73a8b3469e33579bb199cf1af2632c63624f5dc7a5f3d472afe58801caa93', 'lean-candidate/W03/PenaltyComparison.lean': '68ce4fad34901fe101af862bbe9e7e5a9f6e95446c46804efa72a97e21975b05', 'lean-candidate/W03/PowerBounds.lean': '2d36442742503699abc768b676e5e6d951a3c17fe81c89f32a93dc1e443d5c45', 'lean-candidate/W03/ProfileConstraints.lean': '66c140f274be05cbad27c840fdc920d8aa11bb0792dfa72792180825b83a7d12', 'lean-candidate/W03/RealizationIteration.lean': '8ad6262bcf8b0d5c06757c85c4515e5ecd63f7591f769f3c96c61552f0591fb2', 'lean-candidate/W03/TotalIndex.lean': 'a45bf06251ab60c6382ee20a3a7ba82ef2498f4216f0c1d703ba15c084513823', 'lean-candidate/W03/WinnerRealization.lean': 'f59f202b0a73b180ec9fda8ac52c8e66a70d3604d26bad5365fccab65f1b7bb1'}
          expected_names = ['W03.neighbors', 'W03.mem_neighbors', 'W03.vertexDegree', 'W03.vertexDegree_eq_degree', 'W03.core4', 'W03.extend4', 'W03.neighbors_inl_u', 'W03.neighbors_inl_v', 'W03.neighbors_inl_other', 'W03.extend4_degree_inl', 'W03.neighbors_inr_zero', 'W03.neighbors_inr_one', 'W03.neighbors_inr_two', 'W03.neighbors_inr_three', 'W03.extend4_degree_inr', 'W03.extend4_markedEdge', 'W03.extend4_reachable_uv', 'W03.extend4_reachable_of_adj', 'W03.extend4_reachable_old', 'W03.extend4_reachable_new', 'W03.extend4_connected', 'W03.extend4_bridge', 'W03.degreeMultiplicity', 'W03.extend4_degreeMultiplicity_split', 'W03.extend4_degreeMultiplicity', 'W03.extend4_maxDegree', 'W03.iso_vertexDegree', 'W03.iso_degreeMultiplicity', 'W03.extend4Fin', 'W03.extend4FinIso', 'W03.extend4Fin_degree', 'W03.extend4Fin_markedEdge', 'W03.extend4Fin_iterate', 'W03.edgeGraph', 'W03.edgeGraphDecidable', 'W03.profile4', 'W03.blockDegrees', 'W03.degreeMultiplicity_eq_card_filter', 'W03.CertifiedBase', 'W03.certifiedBase_extend', 'W03.base7', 'W03.base8', 'W03.base9', 'W03.base10A', 'W03.base10B', 'W03.base7_degrees', 'W03.base7_connected', 'W03.base7_certificate', 'W03.base8_degrees', 'W03.base8_connected', 'W03.base8_certificate', 'W03.base9_degrees', 'W03.base9_connected', 'W03.base9_certificate', 'W03.base10A_degrees', 'W03.base10A_connected', 'W03.base10A_certificate', 'W03.base10B_degrees', 'W03.base10B_connected', 'W03.base10B_certificate', 'W03.five_base_realizations', 'W03.Realizes', 'W03.profile4_add', 'W03.realizes_add_four', 'W03.realizes_iterate', 'W03.realizes_profile4_iterate', 'W03.WinnerProfile', 'W03.realizes_row_zero', 'W03.realizes_row_one', 'W03.realizes_row_two_first', 'W03.realizes_row_two_second', 'W03.realizes_row_three', 'W03.winnerProfile_realizes', 'W03.exists_graph_of_winnerProfile', 'W03.connected_vertexDegree_pos', 'W03.sum_degree_classes', 'W03.ordered_sum_eq_twice_unordered', 'W03.pairQuadratic', 'W03.ordered_degree_sum_eq_twice_quadratic', 'W03.chemical_unordered_degree_sum', 'W03.totalIndex', 'W03.indexQuadratic', 'W03.totalIndex_eq_indexQuadratic', 'W03.chemical_multiplicities_sum', 'W03.chemical_odd_multiplicities_even', 'W03.chemical_profile_feasible', 'W03.degreeS', 'W03.degreeU', 'W03.degreeV', 'W03.chemical_profile_congruences', 'W03.quadraticPenalty', 'W03.quadraticPenalty_three_squares', 'W03.indexQuadratic_decomposition', 'W03.totalIndex_decomposition', 'W03.powerT', 'W03.powerS', 'W03.powerD', 'W03.powerDelta', 'W03.reciprocal_exponent_bounds', 'W03.power_basic_bounds', 'W03.powerD_gt_two', 'W03.scaled_powerS_sub_one_lt_two', 'W03.powerDelta_bounds', 'W03.real_power_bounds', 'W03.positive_three_term_comparison', 'W03.degreePenalty', 'W03.penalty_coefficients_pos', 'W03.penalty_three_square_comparison', 'W03.penalty_even_square_comparison', 'W03.PenaltyCongruences', 'W03.chemical_penalty_congruences', 'W03.int_square_zero_iff', 'W03.int_square_one_iff', 'W03.int_square_four_iff', 'W03.int_square_ge_one_of_odd', 'W03.int_square_ge_four_of_even_ne_zero', 'W03.int_square_ge_four_of_mod_four', 'W03.penalty_row_zero_even', 'W03.penalty_row_zero_odd', 'W03.penalty_row_one_even', 'W03.penalty_row_one_odd', 'W03.penalty_row_two_odd', 'W03.penalty_row_three_even', 'W03.penalty_row_three_odd', 'W03.penalty_row_two_even']
          workflow = '.github/workflows/w03-four-vertex-extension.yml'
          assert not root.exists()
          run(['git', 'init', str(root)], 'init')
          run(['git', '-C', str(root), 'remote', 'add', 'origin', 'https://github.com/Aurantium-47/chemical-graph-sigma-extremizers.git'], 'remote')
          run(['git', '-C', str(root), 'fetch', '--depth', '1', 'origin', env['CANDIDATE_SHA']], 'fetch-candidate')
          run(['git', '-C', str(root), 'checkout', '--detach', 'FETCH_HEAD'], 'checkout')
          assert run(['git', '-C', str(root), 'rev-parse', 'HEAD'], 'head').strip() == env['CANDIDATE_SHA']
          run(['git', '-C', str(root), 'fetch', '--depth', '1', 'origin', baseline], 'fetch-baseline')
          changed = run(['git', '-C', str(root), 'diff', '--name-status', baseline, 'HEAD'], 'whitelist').splitlines()
          assert set(changed) == {'A\t'+p for p in list(expected)+[workflow]}, changed
          for path, digest in expected.items(): assert sha(root/path) == digest, path
          print('CANDIDATE_COMMIT', env['CANDIDATE_SHA'], 'UNCHANGED_RELEASE', baseline, flush=True)
          print('CANDIDATE_TREE', run(['git', '-C', str(root), 'rev-parse', 'HEAD^{tree}'], 'tree').strip(), flush=True)
          print('CANDIDATE_SOURCE_HASHES', json.dumps(expected, sort_keys=True), flush=True)
          print('WORKFLOW_SHA256', sha(root/workflow), flush=True)
          project = root/'lean-candidate'
          assert (project/'lean-toolchain').read_text().strip() == 'leanprover/lean4:v4.19.0'
          archive = workspace/'lean-4.19.0-linux.tar.zst'
          run(['curl', '--fail', '--location', 'https://github.com/leanprover/lean4/releases/download/v4.19.0/lean-4.19.0-linux.tar.zst', '--output', str(archive)], 'lean-download')
          assert sha(archive) == '6fe3ce97a58f44e2b3567d455b994eacec5bfe9ae7774f2a573444480ba813fe'
          run(['tar', '--zstd', '-xf', str(archive)], 'lean-extract')
          sysroot = workspace/'lean-4.19.0-linux'
          lean = str(sysroot/'bin/lean')
          lake = str(sysroot/'bin/lake')
          assert sha(pathlib.Path(lean)) == '92c3d35b5bfaa5e0fea413a775d504cf46cd95e1345df61c2274f76779e7e023'
          assert sha(pathlib.Path(lake)) == '5111aee5c9434ab05d4265606475ef22e8bda69aaf3a0657b61a7eec6e550bed'
          assert '6caaee842e94' in run([lean, '--version'], 'lean-version')
          env['PATH'] = str(sysroot/'bin') + os.pathsep + env['PATH']
          env['LEAN_SYSROOT'] = str(sysroot)
          manifest = project/'lake-manifest.json'
          assert sha(manifest) == expected['lean-candidate/lake-manifest.json']
          packages = json.loads(manifest.read_text())['packages']
          assert len(packages) == 9
          assert next(p for p in packages if p['name']=='mathlib')['rev'] == 'c44e0c8ee63ca166450922a373c7409c5d26b00b'
          for p in packages:
              assert p['type']=='git' and p['url'].startswith('https://github.com/')
              target = project/'.lake/packages'/p['name']
              assert not target.exists()
              target.mkdir(parents=True)
              prefix = p['name']+'-'
              run(['git', 'init', str(target)], prefix+'init')
              run(['git', '-C', str(target), 'remote', 'add', 'origin', p['url']], prefix+'remote')
              run(['git', '-C', str(target), 'fetch', '--depth', '1', 'origin', p['rev']], prefix+'fetch')
              run(['git', '-C', str(target), 'checkout', '--detach', 'FETCH_HEAD'], prefix+'checkout')
              actual = run(['git', '-C', str(target), 'rev-parse', 'HEAD'], prefix+'head').strip()
              assert actual == p['rev']
              print('DEPENDENCY', p['name'], actual, flush=True)
              if p['name']=='proofwidgets':
                  run(['git', '-C', str(target), 'fetch', '--depth', '1', 'origin', 'refs/tags/v0.0.57:refs/tags/v0.0.57'], prefix+'release')
                  assert run(['git', '-C', str(target), 'rev-parse', 'v0.0.57^{commit}'], prefix+'release-head').strip()==p['rev']
                  assert run(['git', '-C', str(target), 'describe', '--tags', '--exact-match', 'HEAD'], prefix+'release-tag').strip()=='v0.0.57'
          # Keep downloaded files: disable only cache-helper directory pruning.
          helper = project/'.lake/packages/mathlib/Cache/Requests.lean'
          text = helper.read_text()
          for old in ['IO.FS.removeDirAll (buildDir / "lib")', 'IO.FS.removeDirAll (buildDir / "ir")']:
              assert text.count(old)==1
              text=text.replace(old,'pure ()')
          helper.write_text(text)
          assert sha(helper)=='646fed31a48d85ed75746ec09d06c23f5abdaca455518b6760b0dcb2b10c47c0'
          print('CACHE_HELPER_PATCH_SHA256', sha(helper), flush=True)
          cache_roots=['Mathlib.Combinatorics.SimpleGraph.Finite', 'Mathlib.Data.Fintype.Sum', 'Mathlib.Tactic.FinCases', 'Mathlib.Combinatorics.SimpleGraph.Path', 'Mathlib.Logic.Equiv.Fin.Basic', 'Mathlib.Data.Real.Basic', 'Mathlib.Tactic.Ring', 'Mathlib.Analysis.SpecialFunctions.Pow.Real', 'Mathlib.Algebra.BigOperators.Group.Finset.Sigma', 'Mathlib.Combinatorics.SimpleGraph.DegreeSum', 'Mathlib.Analysis.Convex.SpecificFunctions.Pow', 'Mathlib.Tactic.Linarith']
          print('CACHE_ROOTS', json.dumps(cache_roots), flush=True)
          run([lake, 'exe', 'cache', 'get']+cache_roots, 'external-cache', cwd=project, seconds=900)
          print('TRUST: fixed external caches; no complete dependency source rebuild or independent kernel.', flush=True)
          fresh=project/'fresh-candidate'
          assert not fresh.exists()
          (fresh/'lib').mkdir(parents=True)
          libraries=[fresh/'lib']
          own=['W03.FourVertexExtension','W03.FourVertexExtensionConnected','W03.ExtensionCounts','W03.FiniteExtension','W03.BaseGraphs','W03.BaseCertificates','W03.RealizationIteration','W03.WinnerRealization','W03.PairCounting','W03.TotalIndex','W03.ProfileConstraints','W03.IndexDecomposition','W03.PowerBounds','W03.PenaltyComparison','W03.ParityPenalty']
          for p in packages:
